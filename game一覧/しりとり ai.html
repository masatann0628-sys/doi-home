<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>しりとり AI</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141c32;--panel2:#1b2743;--text:#f3f6ff;--muted:#9eaccb;--accent:#8b7cff;--good:#52dfb0;--bad:#ff6b8a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#202b54 0,#0b1020 58%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:980px;margin:auto;padding:28px 16px 48px}.hero{text-align:center;margin:8px 0 24px}.eyebrow{color:#a9a0ff;font-weight:800;letter-spacing:.15em;font-size:.8rem}.hero h1{font-size:clamp(2rem,6vw,3.5rem);margin:8px 0;background:linear-gradient(90deg,#fff,#b8b0ff,#65f0cf);color:transparent;background-clip:text}.hero p{color:var(--muted);margin:0}
.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.panel{background:rgba(20,28,50,.94);border:1px solid #303d60;border-radius:20px;padding:20px;box-shadow:0 18px 45px #0003}.panel h2{font-size:1.05rem;margin:0 0 14px}.status{padding:12px 14px;border-radius:12px;background:var(--panel2);color:#dfe6ff;margin-bottom:14px;min-height:48px}.status.good{border:1px solid #347e70}.status.bad{border:1px solid #8d4056}.inputrow{display:flex;gap:8px}.inputrow input{min-width:0;flex:1;background:#0b1225;border:1px solid #3a496f;color:white;padding:13px 14px;border-radius:12px;font-size:1rem;outline:none}.inputrow input:focus{border-color:var(--accent)}button{border:0;border-radius:12px;background:var(--accent);color:white;font-weight:800;padding:12px 16px;font-size:.95rem;cursor:pointer}button:hover{filter:brightness(1.12)}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#293653}.small{font-size:.84rem;color:var(--muted);line-height:1.6}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.stat{background:#0d1428;border-radius:12px;padding:12px;text-align:center}.stat strong{display:block;font-size:1.3rem}.stat span{font-size:.76rem;color:var(--muted)}.history{display:flex;flex-direction:row;align-items:stretch;gap:8px;width:var(--log-width,100%);max-width:none;min-height:100px;height:auto;overflow-x:auto;overflow-y:hidden;resize:horizontal;padding:2px 2px 10px;min-width:100%;}.move{min-height:calc(var(--log-font, 1.03rem) + 24px);flex:0 0 auto;min-width:max-content}.move .word{flex:0 0 auto;overflow-wrap:normal}.moves-empty{flex:0 0 240px;display:flex;align-items:center;justify-content:center}.move{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#0d1428;border-radius:12px}.move .tag{font-size:.72rem;font-weight:800;padding:4px 7px;border-radius:7px;background:#303c5e;color:#dce4ff}.move.ai .tag{background:#3d347c}.move .word{font-weight:750;font-size:var(--log-font, 1.03rem);flex:1;overflow-wrap:anywhere}.log-controls{display:grid;grid-template-columns:1fr;gap:10px;margin:0 0 12px;padding:12px;border:1px solid #d7e6fa;border-radius:12px;background:#f7faff}.log-control{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;font-size:.86rem;color:#23456d}.log-control input{width:100%;min-width:0}.log-control output{font-variant-numeric:tabular-nums;font-weight:800;min-width:54px;text-align:right}.move .end{color:var(--good);font-size:.82rem}.moves-empty{color:var(--muted);text-align:center;padding:30px 10px}.bottomrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.bottomrow button{flex:1}.rules{margin-top:16px}.rules summary{cursor:pointer;color:#c5cfff;font-weight:700}.rules p{color:var(--muted);font-size:.86rem;line-height:1.7}.result{font-weight:800;font-size:1.2rem}.foot{text-align:center;color:#7180a4;font-size:.78rem;margin-top:18px}
@media(max-width:720px){.layout{grid-template-columns:1fr}.panel{padding:16px}.hero{margin-top:0}.log-control{grid-template-columns:90px 1fr 48px}}

/* 明るい白×ブルーのテーマ */
:root{color-scheme:light;--bg:#f3f8ff;--panel:#ffffff;--panel2:#eaf3ff;--text:#183153;--muted:#60748f;--accent:#2678e8;--good:#087f5b;--bad:#d63355}
body{background:linear-gradient(180deg,#eaf4ff 0%,#f8fbff 48%,#edf5ff 100%);color:var(--text)}
.panel{background:#fff;border:1px solid #d7e6fa;box-shadow:0 12px 35px #315b8a12}
.status{background:#edf5ff;color:#23456d}.inputrow input{background:#fff;border:1px solid #c9dcf5;color:#183153}.inputrow input:focus{border-color:#2678e8;box-shadow:0 0 0 3px #2678e81a}
button{background:#2678e8;color:#fff}.secondary{background:#e7f0fc;color:#22518a}.stat,.move{background:#f3f8ff}.move .tag{background:#dceaff;color:#214d85}.move.ai .tag{background:#dce8ff;color:#234ea0}.move .end{color:#087f5b}.rules summary{color:#22518a}.rules p{color:#60748f}.foot{color:#7b8da5}

/* オープニング：ロゴが左から右へ飛び、中央でタイトルと並ぶ */
#opening{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(180deg,#eaf4ff 0%,#f8fbff 48%,#edf5ff 100%);transition:opacity .35s ease,visibility .35s ease}
#opening.done{opacity:0;visibility:hidden;pointer-events:none}
#openingStage{display:flex;align-items:center;gap:clamp(8px,2vw,22px);padding:12px;max-width:100vw}
#openingTitle{font-weight:950;font-size:clamp(2rem,7vw,5rem);letter-spacing:.08em;color:#2678e8;white-space:nowrap;opacity:0;transform:translateX(-16px);text-shadow:0 3px 0 #fff}
#openingLogo{width:clamp(130px,32vw,285px);height:auto;display:block;filter:drop-shadow(0 12px 18px #315b8a30);transform:translateX(-120vw) rotate(-12deg);animation:logoFly 2s cubic-bezier(.18,.8,.25,1) forwards}
@keyframes logoFly{0%{transform:translateX(-120vw) rotate(-12deg)}72%{transform:translateX(12px) rotate(4deg)}86%{transform:translateX(-5px) rotate(-2deg)}100%{transform:translateX(0) rotate(0)}}
#openingTitle.show{animation:titleAppear .45s ease forwards}
@keyframes titleAppear{to{opacity:1;transform:translateX(0)}}
body.opening-lock{overflow:hidden}
@media(prefers-reduced-motion:reduce){#openingLogo{animation-duration:.01ms}#openingTitle.show{animation-duration:.01ms}}

</style>
</head>

  <header class="hero">
    <div class="eyebrow">SHIRITORI • TACTICAL AI</div>
    <h1>しりとり AI</h1>
    <p>知恵を武器に、次の一手まで読んで勝ちにいく。</p>
  </header>
  <div class="layout">
    <section class="panel">
      <h2>🎮 対戦エリア</h2>
      <div id="status" class="status">あなたからスタート！ 好きな言葉から始めてね。</div>
      <form id="playForm" class="inputrow">
        <input id="wordInput" autocomplete="off" placeholder="例：りんご" aria-label="しりとりの単語">
        <button id="playBtn" type="submit">送信</button>
      </form>
      <div class="stats">
        <div class="stat"><strong id="turnCount">0</strong><span>総手数</span></div>
        <div class="stat"><strong id="leftCount">0</strong><span>AIの候補語数</span></div>
        <div class="stat"><strong id="usedCount">0</strong><span>使用済み単語</span></div>
      </div>
      <div id="result" class="result"></div>
      <div class="bottomrow">
        <button id="restart" class="secondary" type="button">もう一度</button>
        <button id="hint" class="secondary" type="button">ヒント</button>
      </div>
      <details class="rules">
        <summary>ルール・AIの戦略</summary>
        <p>AIは付属リストの言葉から返答します。「ん」で終わる言葉を出した側が負け。使用済み単語は再使用できません。小さい「ゃ・ゅ・ょ」などは読みをそろえて判定し、語尾の「ー」は直前の音の母音として扱います。AIが返せる言葉を見つけられなければ、あなたの勝ちです。</p>
      </details>
    </section>
    <section class="panel">
      <h2>📜 しりとりログ</h2>
      <div class="log-controls" aria-label="ログ表示サイズ調整">
        <label class="log-control" for="logFontSize"><span>文字サイズ</span><input id="logFontSize" type="range" min="12" max="40" value="16"><output id="logFontOutput">16px</output></label>
        <label class="log-control" for="logWidth"><span>ログの横幅</span><input id="logWidth" type="range" min="240" max="1400" value="700" step="20"><output id="logWidthOutput">700px</output></label>
      </div>
      <div id="history" class="history"><div class="moves-empty">対戦ログはここに表示されます。</div></div>
      <div class="foot" id="dictionaryInfo"></div>
    </section>
  </div>

  "電車":"でんしゃ", "電話":"でんわ", "電気":"でんき", "電気毛布":"でんきもうふ",
  "図書館":"としょかん", "公園":"こうえん", "山":"やま", "川":"かわ", "海":"うみ",
  "空":"そら", "花":"はな", "犬":"いぬ", "猫":"ねこ", "鳥":"とり", "魚":"さかな",
  "林檎":"りんご", "蜜柑":"みかん", "苺":"いちご", "西瓜":"すいか", "葡萄":"ぶどう",
  "胡麻":"ごま", "団子":"だんご", "猿":"さる", "麒麟":"きりん", "河馬":"かば",
  "漢字":"かんじ", "平仮名":"ひらがな", "片仮名":"かたかな", "時計":"とけい",
  "新聞":"しんぶん", "本":"ほん", "言葉":"ことば", "音楽":"おんがく", "映画":"えいが",
  "料理":"りょうり", "卵":"たまご", "牛乳":"ぎゅうにゅう", "野菜":"やさい", "果物":"くだもの",
  "手紙":"てがみ", "時計台":"とけいだい", "火山":"かざん", "花火":"はなび",
  "太陽":"たいよう", "月":"つき", "星":"ほし", "雪":"ゆき", "雨":"あめ",
  "風":"かぜ", "雷":"かみなり", "大根":"だいこん", "人参":"にんじん", "玉葱":"たまねぎ",
  "鶏":"にわとり", "牛":"うし", "馬":"うま", "熊":"くま", "狐":"きつね",
  "兎":"うさぎ", "蛙":"かえる", "亀":"かめ", "象":"ぞう", "虎":"とら",
  "ぐーたら生活":"ぐーたらせいかつ", "学校生活":"がっこうせいかつ", "生活":"せいかつ", "飛行機":"ひこうき", "新幹線":"しんかんせん",
  "掃除機":"そうじき", "冷蔵庫":"れいぞうこ", "洗濯機":"せんたくき",
  "消しゴム":"けしごむ", "鉛筆":"えんぴつ", "鞄":"かばん", "靴":"くつ",
  "眼鏡":"めがね", "帽子":"ぼうし", "時計":"とけい", "写真":"しゃしん",
  "神社":"じんじゃ", "神様":"かみさま", "日本語":"にほんご", "英語":"えいご"
};
function toHira(value) {
  let s = String(value).normalize("NFC").toLowerCase();
  for (const [kanji, reading] of Object.entries(KANJI_READINGS).sort((a,b)=>b[0].length-a[0].length)) {
    s = s.split(kanji.toLowerCase()).join(reading);
  }
  // カタカナだけをひらがなに変換。小さい「ゃ・ゅ・ょ・っ」などはそのまま保持。
  const hira = Array.from(s).map(c => {
    const n = c.charCodeAt(0);
    return n >= 0x30a1 && n <= 0x30f6 ? String.fromCharCode(n - 0x60) : c;
  }).join("");
  return hira.replace(/[・\s　]/g, "");
}
function keyWord(w){return toHira(w).replace(/[！!？?。、.,]/g,"").trim();}
function lastKana(w){
  const s=keyWord(w); if(!s)return "";
  let c=s[s.length-1];
  // 「ぱーてぃー」のように長音の直前が小さい仮名なら、その直前の文字で判定
  if(c==="ー" && s.length>2 && /[ぁぃぅぇぉゃゅょっゎゕゖ]/.test(s[s.length-2])) {
    return s[s.length-3];
  }
  // 最後が小さい仮名なら、種類を問わず直前の文字で判定（例：らっきょ→き、ぱぁ→ぱ）
  if(/[ぁぃぅぇぉゃゅょっゎゕゖ]/.test(c) && s.length > 1) return s[s.length - 2];
  if(c==="ー" && s.length>1){
    const prev=s[s.length-2];
    const vowelMap={"あ":"あ","か":"あ","さ":"あ","た":"あ","な":"あ","は":"あ","ま":"あ","や":"あ","ら":"あ","わ":"あ","が":"あ","ざ":"あ","だ":"あ","ば":"あ","ぱ":"あ",
    "い":"い","き":"い","し":"い","ち":"い","に":"い","ひ":"い","み":"い","り":"い","ぎ":"い","じ":"い","ぢ":"い","び":"い","ぴ":"い",
    "う":"う","く":"う","す":"う","つ":"う","ぬ":"う","ふ":"う","む":"う","ゆ":"う","る":"う","ぐ":"う","ず":"う","づ":"う","ぶ":"う","ぷ":"う",
    "え":"え","け":"え","せ":"え","て":"え","ね":"え","へ":"え","め":"え","れ":"え","げ":"え","ぜ":"え","で":"え","べ":"え","ぺ":"え",
    "お":"お","こ":"お","そ":"お","と":"お","の":"お","ほ":"お","も":"お","よ":"お","ろ":"お","ご":"お","ぞ":"お","ど":"お","ぼ":"お","ぽ":"お"};
    c=vowelMap[prev]||prev;
  }
  return c;
}
function firstKana(w){return keyWord(w)[0]||"";}
// 単語リストも読み仮名に統一し、ゲーム内ではひらがなで扱う
for (let i = 0; i < WORDS.length; i++) WORDS[i] = toHira(WORDS[i]);
const validWords = [...new Set(WORDS.filter(w=>{const k=keyWord(w);return k && lastKana(k)!=="ん";}))];
const byStart = new Map();
for(const w of validWords){const k=firstKana(w);if(!byStart.has(k))byStart.set(k,[]);byStart.get(k).push(w);}
const lookup = new Map(validWords.map(w=>[keyWord(w),w]));
let used=new Set(), history=[], currentEnd="", over=false, userTurn=true;
const $=id=>document.getElementById(id);
$("dictionaryInfo").textContent=`単語データ：${validWords.length.toLocaleString()}語（重複整理済み）`;
function available(start, usedSet=used){return (byStart.get(start)||[]).filter(w=>!usedSet.has(keyWord(w)));}
function updateStats(){
  $("turnCount").textContent=history.length;
  $("usedCount").textContent=used.size;
  $("leftCount").textContent=currentEnd?available(currentEnd).length:validWords.length;
}
function renderHistory(){
  const el=$("history");
  if(!history.length){el.innerHTML='<div class="moves-empty">対戦ログはここに表示されます。</div>';return;}
  el.innerHTML=history.slice().reverse().map(m=>`<div class="move ${m.who==='AI'?'ai':''}"><span class="tag">${m.who==='AI'?'最強AI':'あなた'}</span><span class="word">${escapeHtml(m.word)}</span><span class="end">→ ${escapeHtml(lastKana(m.word))}</span></div>`).join("");
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function setStatus(msg,type=""){ $("status").className="status "+type; $("status").textContent=msg; }
function addMove(who,word){
  word = toHira(word); // 表示・判定ともにひらがなへ統一
  used.add(keyWord(word));history.push({who,word});currentEnd=lastKana(word);renderHistory();updateStats();
}
function endGame(msg,win){
  over=true;$("result").textContent=msg;$("result").style.color=win?"var(--good)":"var(--bad)";
  $("wordInput").disabled=true;$("playBtn").disabled=true;
}
function aiChoose(){
  const cand=available(currentEnd);
  if(!cand.length)return null;
  // Score a move by how many replies it leaves. Prefer immediate lockout,
  // then choose a reply with few onward choices, while avoiding handing over a forced win.
  let best=null,bestScore=Infinity;
  for(const w of cand){
    const next=lastKana(w);
    const simulated=new Set(used);simulated.add(keyWord(w));
    const replies=available(next,simulated);
    let score;
    if(replies.length===0) score=-100000; // immediate win
    else {
      // Estimate opponent's best reply: can they leave us no move?
      let opponentCanLock=false, minAfter=Infinity;
      for(const r of replies){
        const s2=new Set(simulated);s2.add(keyWord(r));
        const onward=available(lastKana(r),s2);
        if(onward.length===0){opponentCanLock=true;break;}
        minAfter=Math.min(minAfter,onward.length);
      }
      score=(opponentCanLock?10000:0) + replies.length*10 + (minAfter===Infinity?0:minAfter);
      // tiny deterministic preference for fewer branches in the opponent's position
    }
    if(score<bestScore){bestScore=score;best=w;}
  }
  return best;
}
function playAI(){
  if(over)return;
  const choice=aiChoose();
  if(!choice){endGame("AIの手がない！ あなたの勝ち！",true);setStatus("相手の候補がなくなりました。あなたの勝ち！","good");return;}
  addMove("AI",choice);
  if(lastKana(choice)==="ん"){endGame("AIが「ん」で終わる単語を出してしまいました。あなたの勝ち！",true);return;}
  setStatus(`AI：${choice}。次は「${currentEnd}」から！`,"good");
  userTurn=true;$("wordInput").disabled=false;$("playBtn").disabled=false;$("wordInput").focus();
}
$("playForm").addEventListener("submit",e=>{
  e.preventDefault();if(over||!userTurn)return;
  const raw=$("wordInput").value.trim(),k=keyWord(raw);
  if(!k){setStatus("単語を入力してね。","bad");return;}
  // プレイヤーはAI辞書に載っていない単語も使用可能
  if(used.has(k)){setStatus("その単語はもう使われているよ！","bad");return;}
  if(lastKana(k)==="ん"){addMove("あなた",raw);endGame("「ん」で終わったので、あなたの負け！",false);setStatus("「ん」で終わる単語を出したため、あなたの負けです。","bad");$("wordInput").value="";return;}
  if(currentEnd && firstKana(k)!==currentEnd){setStatus(`「${currentEnd}」から始まる単語を入力してね。`,"bad");return;}
  addMove("あなた",raw);$("wordInput").value="";
  if(!available(currentEnd).length){endGame("あなたの勝ち！ AIの次の手がありません。",true);setStatus("見事！ AIを行き止まりにした！","good");return;}
  userTurn=false;$("wordInput").disabled=true;$("playBtn").disabled=true;
  setStatus("AIが最善手を計算中…");
  // yield to UI before search
  setTimeout(playAI,40);
});
$("restart").addEventListener("click",()=>{
  used=new Set();history=[];currentEnd="";over=false;userTurn=true;
  $("result").textContent="";$("wordInput").disabled=false;$("playBtn").disabled=false;$("wordInput").value="";
  setStatus("あなたからスタート！ 単語リスト外の言葉も入力できるよ。");renderHistory();updateStats();$("wordInput").focus();
});
$("hint").addEventListener("click",()=>{
  if(over){setStatus("「もう一度」で新しい対戦を始められるよ。");return;}
  const candidates=currentEnd?available(currentEnd):validWords;
  if(!candidates.length){setStatus(`「${currentEnd}」から始まるAIの候補がありません。あなたの勝ちです。`,"good");return;}
  const pick=candidates.slice().sort((a,b)=>available(lastKana(a),new Set([...used,keyWord(a)])).length-available(lastKana(b),new Set([...used,keyWord(b)])).length)[0];
  setStatus(`ヒント：${pick}（次の文字は「${lastKana(pick)}」）`);
});
updateStats();

// ログの文字サイズと横幅をスライダーで調整
function updateLogSize(){
  const font = Number($("logFontSize").value);
  const width = Number($("logWidth").value);
  document.documentElement.style.setProperty("--log-font", `${font}px`);
  document.documentElement.style.setProperty("--log-width", `${width}px`);
  $("logFontOutput").textContent = `${font}px`;
  $("logWidthOutput").textContent = `${width}px`;
}
$("logFontSize").addEventListener("input", updateLogSize);
$("logWidth").addEventListener("input", updateLogSize);
updateLogSize();

// オープニング：ロゴは2秒で左から右へ飛び、着地後に左側へ「しりとり」を表示。
(function(){
  const opening = document.getElementById('opening');
  const title = document.getElementById('openingTitle');
  const logo = document.getElementById('openingLogo');
  if (!opening || !title || !logo) return;
  logo.addEventListener('animationend', () => {
    title.classList.add('show');
    window.setTimeout(() => {
      opening.classList.add('done');
      document.body.classList.remove('opening-lock');
      window.setTimeout(() => opening.remove(), 400);
    }, 1000);
  }, {once:true});
})();
